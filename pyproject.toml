[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-dataset-generator"
dynamic = ["version"]
description = "Wake word synthetic dataset generation and augmentation scripts"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "OpenVoiceOS", email = "jarbasai@mailfence.com" }]
keywords = ["ovos", "wake-word", "dataset", "augmentation", "adversarial"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "click>=8.0",
    "requests>=2.0",
]

[project.optional-dependencies]
augment = ["librosa", "soundfile", "numpy", "tqdm"]
test    = ["pytest>=7.0", "pytest-cov"]

[project.urls]
Repository = "https://github.com/TigreGotico/synthetic_dataset_generator"

[tool.setuptools.packages.find]
where = ["."]
include = []


[tool.setuptools.dynamic]
version = {attr = "version.__version__"}
